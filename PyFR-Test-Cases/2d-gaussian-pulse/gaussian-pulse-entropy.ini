[backend]
precision = double

[constants]
gamma = 1.4
mu = 0.0001
Pr = 0.72
rho0 = 1.0
rhoAmp = 2.0
x0 = 0.0
y0 = 0.0
sigma = 0.01

[solver]
system = navier-stokes
order = 7
shock-capturing = ec-artificial-viscosity

[solver-time-integrator]
scheme = rk4
controller = none
tstart = 0.0
tend = 0.5
dt = 0.001

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.0

[solver-interfaces-line]
flux-pts = gauss-legendre-lobatto

[solver-elements-tri]
soln-pts = williams-shunn

[solver-elements-quad]
soln-pts = gauss-legendre-lobatto

[soln-plugin-nancheck]

[soln-plugin-writer]
dt-out = 0.1
basedir = gaussian-pulse-run
basename = gaussian-pulse-{n:03d}

[backend-openmp]
cc = /opt/homebrew/bin/gcc-15

[soln-ics]
rho = rho0 + rhoAmp*exp(-((x-x0)*(x-x0) + (y-y0)*(y-y0))/(sigma*sigma))
u = 0.0
v = 0.0
p = pow(rho0 + rhoAmp*exp(-((x-x0)*(x-x0) + (y-y0)*(y-y0))/(sigma*sigma)), gamma)
