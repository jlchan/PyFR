[backend]
precision = double

[constants]
gamma = 1.4
mu = 1.0e-4
Pr = 0.72
pi = 3.141592653589793
eps = 0.01
alpha = 80.0

[solver]
system = navier-stokes
order = 3
shock-capturing = ec-artificial-viscosity

[solver-time-integrator]
scheme = rk4
controller = cfl
dt = 1e-4          # initial dt; updated from CFL each step
cfl = 1.5          # linear-advection guide ~2.79 for rk4
dt-max = 1e-3      # optional cap (default 100)
cfl-nsteps = 1     # recompute every N accepted steps (default 1)
tstart = 0.0
tend = 2.0

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.0

[solver-interfaces-line]
flux-pts = gauss-legendre-lobatto

[solver-elements-quad]
soln-pts = gauss-legendre-lobatto

[soln-plugin-nancheck]

[soln-plugin-writer]
dt-out = 0.5
basedir = kh-run
basename = kh-{t:.2f}

[backend-openmp]
cc = /opt/homebrew/bin/gcc-15

[soln-ics]
alpha = 40.0
rho = 1.5 + 0.5*tanh(alpha*(abs(y) - 0.25))
u = 0.5*tanh(alpha*(0.25 - abs(y)))
v = 0.01*sin(2*pi*x)
p = 2.5
