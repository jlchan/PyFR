[backend]
precision = double

[constants]
gamma = 1.4
mu = 1.0e-8
Pr = 0.72
pi = 3.141592653589793
alpha = 80.0

[solver]
system = navier-stokes
order = 3
shock-capturing = entropy-filter

[solver-time-integrator]
scheme = rk4
controller = cfl
dt = 1e-5          # initial dt; updated from CFL each step
cfl = 0.9          # linear-advection guide ~2.79 for rk4
dt-max = 5e-4      # optional cap (default 100)
cfl-nsteps = 1     # recompute every N accepted steps (default 1)
tstart = 0.0
tend = 5.0

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.0

[solver-interfaces-line]
flux-pts = gauss-legendre-lobatto

[solver-elements-quad]
soln-pts = gauss-legendre-lobatto

[soln-plugin-nancheck]

[soln-plugin-writer]
dt-out = 0.5
basedir = /scratch/11547/jlchan/pyfr-runs/kh-run-entropy-filter
basename = kh-{t:.2f}

[backend-cuda]
device-id = local-rank
mpi-type = standard

[soln-ics]
rho = 1.5 + 0.5*tanh(alpha*(abs(y) - 0.25))
u = 0.5*tanh(alpha*(0.25 - abs(y)))
v = 0.01*sin(2*pi*x)
p = 2.5
