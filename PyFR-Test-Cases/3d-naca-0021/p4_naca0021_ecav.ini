[backend]
precision = double
rank-allocator = linear

[backend-cuda]
device-id = local-rank
mpi-type = standard

[constants]
gamma = 1.4
mu = 0.0000037
Pr = 0.72

M = 0.1
uc = 1.0
rhoc = 1.0

; For pyfr export boundary --postproc cp (must be numeric literals)
rho-inf = 1.0
u-inf = 1.0
p-inf = 71.42857142857143

[solver]
system = navier-stokes
order = 4

[solver-ec-artificial-viscosity]
enabled = true

[solver-time-integrator]
scheme = rk45
controller = pi
tstart = 0.0
tend = 300.0
dt = 2.5e-8
atol = 1e-6
rtol = 1e-6

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.0

[solver-interfaces-quad]
flux-pts = gauss-legendre-lobatto

[solver-elements-hex]
soln-pts = gauss-legendre-lobatto

[soln-bcs-wall]
type = no-slp-adia-wall

[soln-bcs-inflow]
type = char-riem-inv
rho = rhoc
u = uc
v = 0
w = 0
p = rhoc*uc*uc/(M*M*gamma)

[soln-bcs-outflow]
type = char-riem-inv
p = rhoc*uc*uc/(M*M*gamma)
u = uc
v = 0
w = 0
rho = rhoc

[soln-ics]
rho = rhoc
u = uc
v = 0
w = 0
p = rhoc*uc*uc/(M*M*gamma)

; ---------------------------------------------------------------------------
; Diagnostics
; ---------------------------------------------------------------------------

[soln-plugin-nancheck]
nsteps = 200

; ---------------------------------------------------------------------------
; Volume snapshots (instantaneous fields, not time-averaged)
; ---------------------------------------------------------------------------

[soln-plugin-writer]
dt-out = 50.0
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = naca-p4-ecav-{t:.2f}
write-gradients = true

[soln-plugin-writer-checkpoint]
dt-out = 20.0
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = checkpoint-{t:.4f}

[soln-plugin-writer-wall-snap]
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = wall-snap-{t:.4f}
region = wall
region-type = surface
trigger = stats-end
trigger-action = gate

; ---------------------------------------------------------------------------
; Force time series -> CL/CD means and lift PSD (Welch in post-processing)
; Paper: sampling rate 0.00625 t/c, Welch nperseg=4096, noverlap=4096-10
; Tune nsteps once you know the mean accepted dt from a short run:
;   nsteps ~ round(0.00625 / dt_accepted)
; ---------------------------------------------------------------------------

[soln-plugin-fluidforce-wall]
nsteps = 250
quad-deg = 11
file = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run/wall-forces.csv
header = true
publish-as = forces

; ---------------------------------------------------------------------------
; Triggers: paper statistics over t/c in [100, 300]
; ---------------------------------------------------------------------------

[trigger-stats-start]
type = time
t = 100.0
mode = latch

[trigger-stats-end]
type = time
t = 300.0
mode = edge

; ---------------------------------------------------------------------------
; Time-averaged wall Cp: continuous average over [100, 300]
; Span average in post: pyfr export spanwise ... --eopt periodic:0
; ---------------------------------------------------------------------------

[soln-plugin-tavg-wall-cont]
nsteps = 10
dt-out = 200.0
mode = continuous
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = tavg-wall-cont-{t:.4f}
region = wall
region-type = surface
precision = double
trigger = stats-start
trigger-action = activate

avg-p = p
fun-avg-cp = (p - rhoc*uc*uc/(M*M*gamma)) / (0.5*rhoc*uc*uc)

; ---------------------------------------------------------------------------
; Time-averaged wall Cp: 50 t/c windowed averages after t = 100
; Merge windows in post: pyfr tavg merge tavg-wall-win-*.pyfrs merged.pyfrs
; ---------------------------------------------------------------------------

[soln-plugin-tavg-wall-win]
nsteps = 10
dt-out = 50.0
mode = windowed
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = tavg-wall-win-{t:.4f}
region = wall
region-type = surface
precision = double
trigger = stats-start
trigger-action = activate

avg-p = p
fun-avg-cp = (p - rhoc*uc*uc/(M*M*gamma)) / (0.5*rhoc*uc*uc)

; ---------------------------------------------------------------------------
; Time-averaged volume fields: continuous average over [100, 300]
; ---------------------------------------------------------------------------

[soln-plugin-tavg-vol-cont]
nsteps = 10
dt-out = 200.0
mode = continuous
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = tavg-vol-cont-{t:.4f}
region = *
precision = double
trigger = stats-start
trigger-action = activate

avg-u = u
avg-v = v
avg-w = w
avg-p = p
avg-uu = u*u
avg-vv = v*v
avg-ww = w*w
avg-uv = u*v
avg-uw = u*w
avg-vw = v*w

fun-avg-upup = uu - u*u
fun-avg-vpvp = vv - v*v
fun-avg-wpvp = ww - w*w
fun-avg-upvp = uv - u*v
fun-avg-upwp = uw - u*w
fun-avg-vpwp = vw - v*w

; ---------------------------------------------------------------------------
; Time-averaged volume fields: 50 t/c windowed averages after t = 100
; ---------------------------------------------------------------------------

[soln-plugin-tavg-vol-win]
nsteps = 10
dt-out = 50.0
mode = windowed
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = tavg-vol-win-{t:.4f}
region = *
precision = double
trigger = stats-start
trigger-action = activate

avg-u = u
avg-v = v
avg-w = w
avg-p = p
avg-uu = u*u
avg-vv = v*v
avg-ww = w*w
avg-uv = u*v
avg-uw = u*w
avg-vw = v*w

fun-avg-upup = uu - u*u
fun-avg-vpvp = vv - v*v
fun-avg-wpvp = ww - w*w
fun-avg-upvp = uv - u*v
fun-avg-upwp = uw - u*w
fun-avg-vpwp = vw - v*w

; ---------------------------------------------------------------------------
; Wall-clock safety checkpoint
; ---------------------------------------------------------------------------

[trigger-wall-limit]
type = wallclock
t = 171000
mode = edge

[soln-plugin-writer-wall]
basedir = /scratch/11547/jlchan/pyfr-runs/naca-0021-p4-ecav-run
basename = checkpoint-{t:.4f}
trigger = wall-limit
trigger-action = gate
